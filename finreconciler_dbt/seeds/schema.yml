version: 2

seeds:
  - name: accounts_payable
    description: >
      "Raw Accounts Payable invoices generated from the Python data generation pipeline.
      Contains vendor invoices across a 90-day window. Reconciliation status is not
      stored here — it is derived by joining with the General Ledger in dbt models."
    columns:
      - name: ap_id
        description: "Unique AP invoice identifier."
      - name: vendor_id
        description: "Vendor identifier (VENDOR00001 - VENDOR00050)."
      - name: invoice_num
        description: "Vendor invoice number used as document reference in the GL."
      - name: amount
        description: "Invoice amount in USD."
      - name: invoice_date
        description: "Timestamp when the invoice was issued."
      - name: status
        description: "Payment status. Values: paid, pending, disputed."

  - name: accounts_receivable
    description: >
      "Raw Accounts Receivable invoices generated from the Python data generation pipeline.
      Contains customer invoices across a 90-day window. AR carries a higher unposted
      rate than AP (8% vs 5%) due to collection delays and partial payments."
    columns:
      - name: ar_id
        description: "Unique AR invoice identifier."
      - name: vendor_id
        description: "Customer identifier (CUST00001 - CUST00100)."
      - name: invoice_num
        description: "Sales invoice number used as document reference in the GL."
      - name: amount
        description: "Invoice amount in USD."
      - name: invoice_date
        description: "Timestamp when the invoice was issued."
      - name: status
        description: "Collection status. Values: paid, pending, partial."

  - name: general_ledger
    description: >
      "Raw General Ledger entries derived from AP and AR invoices using double-entry
      bookkeeping. Each source invoice produces two journal lines (debit + credit)
      sharing the same journal_id. Includes controlled noise: ~5% AP and ~8% AR
      invoices are intentionally absent (unposted), and ~3% are manual adjustment
      entries with no source document reference."
    columns:
      - name: gl_id
        description: "Unique GL line identifier (primary key)."
      - name: journal_id
        description: "Groups the debit and credit lines of a single transaction."
      - name: document_ref
        description: "Invoice number linking this GL entry back to AP or AR. Null for manual entries."
      - name: account_code
        description: "Chart of accounts code. Values: 1100 (AR), 2100 (AP), 4000 (Revenue), 5000 (Expense), 9000 (Suspense)."
      - name: account_name
        description: "Human-readable account name corresponding to account_code."
      - name: department
        description: "Cost center / department that owns this GL entry."
      - name: amount
        description: "Absolute transaction amount in USD. Always positive — direction is carried by entry_type."
      - name: entry_type
        description: "Double-entry direction. Values: debit, credit."
      - name: entry_description
        description: "Formatted string embedding transaction data. Format: 'AP Invoice {inv} | Vendor {vendor} | {date}' or 'Manual Entry {jnl} | Dept: {dept} | Period: {period}'."
      - name: source_system
        description: "Originating subledger. Values: AP, AR, MANUAL."
      - name: posting_date
        description: "Date the entry was posted to GL. May differ from invoice_date by 0-3 days (posting delay)."
      - name: status
        description: "GL entry status. Values: posted, pending."
