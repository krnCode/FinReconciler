version: 2

models:
  - name: int__unmatched_ap
    description: >
      This model finds accounts payable that are not in the general ledger.
      All the records represent a mismatch between the two systems.
    columns:
      - name: ap_id
        description: The accounts payable ID.
        tests:
          - unique
          - not_null
      - name: gl_id
        description: The general ledger ID.
      - name: ap_vendor_id
        description: The vendor ID.
        tests:
          - not_null
      - name: invoice_num
        description: The invoice number.
        tests:
          - not_null
      - name: ap_amount
        description: The amount.
        tests:
          - not_null
      - name: invoice_date
        description: The invoice date.
        tests:
          - not_null
      - name: ap_invoice_status
        description: The status of the accounts payable invoice.
        tests:
          - not_null