version: 1

models:
  - name: int__unmatched_ar
    description: >
      This model finds accounts receivable that are not in the general ledger.
      All the records represent a mismatch between the two systems.
    columns:
      - name: ar_id
        description: The accounts receivable ID.
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: The vendor ID.
        tests:
          - not_null
      - name: invoice_num
        description: The invoice number.
        tests:
          - not_null
      - name: ar_amount
        description: The amount.
        tests:
          - not_null
      - name: invoice_date
        description: The invoice date.
        tests:
          - not_null
      - name: ar_invoice_status
        description: The status of the accounts receivable invoice.
        tests:
          - not_null