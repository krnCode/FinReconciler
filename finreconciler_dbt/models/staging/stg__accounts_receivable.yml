version: 1

models:
  - name: stg__accounts_receivable
    description: >
      "This model adds the raw data from the accounts_receivable table to the staging layer.
      No transformations are applied to the data in this model."
    columns:
      - name: ar_id
        description: "Accounts receivable ID. PK."
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: "Vendor ID."
        tests:
          - not_null
      - name: invoice_num
        description: "Invoice number."
        tests:
          - not_null
      - name: amount
        description: "Value of the transaction in the invoice."
      - name: invoice_date
        description: "Date of the invoice."
      - name: status
        description: "Status of the transaction. Values: 'paid', 'pending', 'partial'."